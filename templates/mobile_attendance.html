<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chấm công mobile - FaceAttend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="/static/js/auth-guard.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#080b0f;
  --surface:#101720;
  --panel:#17202b;
  --line:#2b3745;
  --text:#eef4f0;
  --muted:#8a98a8;
  --green:#33d17a;
  --teal:#00d4aa;
  --blue:#4aa3ff;
  --amber:#ffca3a;
  --red:#ff5f6d;
  --ink:#020604;
  --font-sans:'Sora',sans-serif;
  --font-mono:'Space Mono',monospace;
}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
body{overflow-x:hidden}
.mobile-shell{min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(180deg,#090f14 0%,#0d141b 46%,#07090d 100%)}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,11,15,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,212,170,.58);display:grid;place-items:center;background:rgba(0,212,170,.08);flex:0 0 auto}
.brand-title{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout{height:34px;border:1px solid rgba(255,95,109,.34);background:transparent;color:var(--red);border-radius:8px;padding:0 11px;font:700 11px var(--font-sans);cursor:pointer}
.content{width:min(980px,100%);margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.camera-stage{position:relative;min-height:560px;border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden;background:#020406;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.camera-stage::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 22%,transparent 64%,rgba(0,0,0,.62));z-index:2;pointer-events:none}
video{width:100%;height:100%;min-height:560px;object-fit:cover;display:block;transform:scaleX(-1);background:#05080c}
.camera-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;background:#05080c;z-index:3}
.camera-empty.hidden{display:none}
.empty-icon{width:60px;height:60px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;margin:0 auto 12px;color:var(--teal);background:rgba(0,212,170,.06)}
.empty-title{font-size:15px;font-weight:800;color:var(--text)}
.empty-note{font-size:12px;line-height:1.55;margin-top:6px;max-width:280px}
.scan{position:absolute;inset:18px;border:1px solid rgba(0,212,170,.34);z-index:4;pointer-events:none}
.scan::before,.scan::after{content:'';position:absolute;width:44px;height:44px;border-color:var(--teal);border-style:solid}
.scan::before{top:-1px;left:-1px;border-width:3px 0 0 3px}
.scan::after{right:-1px;bottom:-1px;border-width:0 3px 3px 0}
.stage-top{position:absolute;top:16px;left:16px;right:16px;z-index:6;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{min-height:30px;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);background:rgba(8,11,15,.72);backdrop-filter:blur(10px);border-radius:999px;padding:0 10px;font:700 11px var(--font-sans);color:var(--text)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--muted);box-shadow:0 0 0 3px rgba(138,152,168,.14);flex:0 0 auto}
.pill.good .dot{background:var(--green);box-shadow:0 0 0 3px rgba(51,209,122,.16)}
.pill.warn .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(255,202,58,.16)}
.pill.bad .dot{background:var(--red);box-shadow:0 0 0 3px rgba(255,95,109,.16)}
.result-sheet{position:absolute;left:16px;right:16px;bottom:16px;z-index:8;border:1px solid rgba(255,255,255,.12);background:rgba(13,20,27,.86);backdrop-filter:blur(16px);border-radius:8px;padding:14px;display:none}
.result-sheet.show{display:block;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:20px;line-height:1.2;font-weight:800}
.result-msg{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.result-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{font:700 10px var(--font-mono);color:var(--muted);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 7px;background:rgba(255,255,255,.04)}
.side{display:grid;gap:10px}
.panel{border:1px solid rgba(255,255,255,.1);background:var(--surface);border-radius:8px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel-body{padding:13px}
.profile{display:flex;align-items:center;gap:11px}
.avatar{width:50px;height:50px;border-radius:50%;border:2px solid rgba(0,212,170,.64);background:rgba(0,212,170,.08);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:15px;font-weight:800;line-height:1.15}
.code{font:700 11px var(--font-mono);color:var(--teal);margin-top:3px}
.muted{font-size:11px;color:var(--muted);line-height:1.45}
.kv{display:grid;gap:9px}
.kv-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:start}
.kv-label{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv-value{font-size:12px;color:var(--text);line-height:1.4;word-break:break-word}
.mono{font-family:var(--font-mono)}
.status-list{display:grid;gap:8px}
.status-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:8px;padding:9px 10px}
.status-left{display:flex;align-items:center;gap:8px;min-width:0}
.status-title{font-size:12px;font-weight:800}
.status-value{font:700 11px var(--font-mono);color:var(--muted);white-space:nowrap}
.action-bar{position:sticky;bottom:0;z-index:16;grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px;padding-top:2px}
.primary{min-height:54px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--teal));color:var(--ink);font:800 15px var(--font-sans);cursor:pointer;box-shadow:0 14px 32px rgba(0,212,170,.18)}
.primary:disabled{background:#27313d;color:#708090;box-shadow:none;cursor:not-allowed}
.ghost{min-height:54px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:var(--surface);color:var(--text);font:800 12px var(--font-sans);cursor:pointer;padding:0 14px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;z-index:50;border:1px solid rgba(255,255,255,.12);background:rgba(12,18,25,.94);backdrop-filter:blur(14px);border-radius:8px;padding:12px 13px;font-size:12px;line-height:1.45;transform:translateY(16px);opacity:0;pointer-events:none;transition:.18s}
.toast.show{transform:translateY(0);opacity:1}
.toast.good{border-color:rgba(51,209,122,.4)}
.toast.bad{border-color:rgba(255,95,109,.42)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.22);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#canvas{display:none}
@media(max-width:860px){
  .content{grid-template-columns:1fr;padding:10px;gap:10px}
  .camera-stage{min-height:calc(100svh - 360px);height:calc(100svh - 360px)}
  video{min-height:100%;height:100%}
  .side{grid-template-columns:1fr}
  .action-bar{grid-template-columns:1fr auto}
}
@media(max-width:520px){
  .topbar{height:56px;padding:9px 10px}
  .brand-sub{display:none}
  .content{padding:8px}
  .camera-stage{height:calc(100svh - 340px);min-height:300px}
  .stage-top{top:12px;left:12px;right:12px;flex-direction:column;align-items:flex-start}
  .result-title{font-size:18px}
  .panel-body{padding:11px}
  .action-bar{grid-template-columns:1fr}
  .ghost{min-height:44px}
}
</style>
</head>
<body>
<div class="mobile-shell">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="2.2" stroke-linecap="round">
          <path d="M9 3H5a2 2 0 0 0-2 2v4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/>
          <path d="M3 15v4a2 2 0 0 0 2 2h4"/><path d="M21 15v4a2 2 0 0 1-2 2h-4"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">FaceAttend</div>
  <div class="brand-sub" id="deviceLabel">Mobile attendance</div>
      </div>
    </div>
    <button class="logout" data-logout>Đăng xuất</button>
  </header>

  <main class="content">
    <section class="camera-stage" aria-label="Camera chấm công">
      <video id="video" autoplay muted playsinline></video>
      <div id="cameraEmpty" class="camera-empty">
        <div>
          <div class="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
            </svg>
          </div>
          <div class="empty-title" id="cameraEmptyTitle">Đang mở camera</div>
          <div class="empty-note" id="cameraEmptyNote">Vui lòng cho phép truy cập camera trước.</div>
        </div>
      </div>
      <div class="scan"></div>
      <div class="stage-top">
        <div class="pill warn" id="cameraPill"><span class="dot"></span><span>Camera</span></div>
        <div class="pill warn" id="gpsPill"><span class="dot"></span><span>GPS</span></div>
      </div>
      <div class="result-sheet" id="resultSheet">
        <div class="result-title" id="resultTitle">Đang xử lý</div>
        <div class="result-msg" id="resultMsg">Server đang xác minh.</div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><span>Nhân viên</span><span class="mono" id="serverClock">--:--</span></div>
        <div class="panel-body">
          <div class="profile">
            <div class="avatar" id="avatar">?</div>
            <div>
              <div class="name" id="empName">Đang tải</div>
              <div class="code" id="empCode">--</div>
              <div class="muted" id="empDept">--</div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>Cửa hàng</span><span id="branchState">--</span></div>
        <div class="panel-body kv">
          <div class="kv-row"><div class="kv-label">Tên</div><div class="kv-value" id="branchName">--</div></div>
          <div class="kv-row"><div class="kv-label">Bán kính</div><div class="kv-value mono" id="branchRadius">--</div></div>
          <div class="kv-row"><div class="kv-label">Khoảng cách</div><div class="kv-value mono" id="distanceText">--</div></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>Ca làm</span><span id="shiftState">--</span></div>
        <div class="panel-body kv">
          <div class="kv-row"><div class="kv-label">Ca</div><div class="kv-value" id="shiftName">--</div></div>
          <div class="kv-row"><div class="kv-label">Giờ</div><div class="kv-value mono" id="shiftTime">--</div></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>Trạng thái</span><span id="readyState">--</span></div>
        <div class="panel-body">
          <div class="status-list">
            <div class="status-item">
              <div class="status-left"><span class="dot" id="sCamera"></span><span class="status-title">Camera</span></div>
              <div class="status-value" id="vCamera">--</div>
            </div>
            <div class="status-item">
              <div class="status-left"><span class="dot" id="sGps"></span><span class="status-title">GPS</span></div>
              <div class="status-value" id="vGps">--</div>
            </div>
            <div class="status-item">
              <div class="status-left"><span class="dot" id="sGpsDebug"></span><span class="status-title">GPS debug</span></div>
              <div class="status-value" id="vGpsDebug">--</div>
            </div>
            <div class="status-item">
              <div class="status-left"><span class="dot" id="sPolicy"></span><span class="status-title">Policy</span></div>
              <div class="status-value" id="vPolicy">--</div>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <div class="action-bar">
      <button class="primary" id="btnAttend" onclick="submitAttendance()" disabled>Chấm công</button>
      <button class="ghost" onclick="refreshAll()">Làm mới</button>
    </div>
  </main>
</div>
<canvas id="canvas"></canvas>
<div class="toast" id="toast"></div>

<script>
let contextData=null;
let currentPosition=null;
let cameraReady=false;
let gpsReady=false;
let busy=false;
let serverBase=null;
let serverBaseClientTs=0;
let geoWatchId=null;
let gpsPendingTimer=null;
let gpsTickTimer=null;
let gpsStartedAt=0;
let mobileDeviceOk=false;

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const btnAttend=document.getElementById('btnAttend');

function deviceId(){
  let id=localStorage.getItem('mobile_device_id');
  if(!id){
    id=(crypto.randomUUID?crypto.randomUUID():('mob-'+Date.now()+'-'+Math.random().toString(16).slice(2)));
    localStorage.setItem('mobile_device_id',id);
  }
  return id;
}

function detectMobileDevice(){
  const ua=navigator.userAgent||'';
  const uaData=navigator.userAgentData;
  if(uaData&&typeof uaData.mobile==='boolean') return uaData.mobile;
  return /Android|iPhone|iPod|iPad|Mobile|Windows Phone|Tablet/i.test(ua);
}

function setPill(id,tone,text){
  const el=document.getElementById(id);
  el.className='pill '+tone;
  el.querySelector('span:last-child').textContent=text;
}

function setDot(id,tone){
  const el=document.getElementById(id);
  el.style.background=tone==='good'?'var(--green)':tone==='bad'?'var(--red)':tone==='warn'?'var(--amber)':'var(--muted)';
  el.style.boxShadow='none';
}

function toast(message,tone=''){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.className='toast show '+tone;
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>{el.className='toast';},4200);
}

function fmtTime(date){
  return date.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function updateClock(){
  if(!serverBase)return;
  const now=new Date(serverBase.getTime()+(Date.now()-serverBaseClientTs));
  document.getElementById('serverClock').textContent=fmtTime(now);
}

async function loadContext(){
  const res=await authFetch('/api/mobile/attendance/context');
  contextData=await res.json();
  serverBase=new Date(contextData.server_time);
  serverBaseClientTs=Date.now();
  renderContext();
}

function renderContext(){
  const emp=contextData.employee;
  const branch=contextData.branch;
  const shift=contextData.shift||{};
  if(emp){
    document.getElementById('empName').textContent=emp.name||'--';
    document.getElementById('empCode').textContent=emp.emp_code||'--';
    document.getElementById('empDept').textContent=emp.department||emp.position||'--';
    const av=document.getElementById('avatar');
    if(emp.avatar_url) av.innerHTML=`<img src="${emp.avatar_url}" alt="">`;
    else av.textContent=(emp.name||'?').slice(0,1).toUpperCase();
  }else{
    document.getElementById('empName').textContent='Chưa liên kết nhân viên';
    document.getElementById('empCode').textContent='--';
    document.getElementById('empDept').textContent='--';
  }
  if(branch){
    document.getElementById('branchName').textContent=branch.name||'--';
    document.getElementById('branchRadius').textContent=(branch.geofence_radius_m||50)+' m';
    document.getElementById('branchState').textContent=branch.mobile_attendance_enabled?'Bật':'Tắt';
  }else{
    document.getElementById('branchName').textContent='Chưa cấu hình';
    document.getElementById('branchRadius').textContent='--';
    document.getElementById('branchState').textContent='--';
  }
  const shifts=shift.shifts||[];
  document.getElementById('shiftName').textContent=shifts.length?shifts.map(s=>s.shift_name).join(', '):(shift.shift_name||'Chưa có ca');
  document.getElementById('shiftTime').textContent=shifts.length?shifts.map(s=>`${s.work_start}-${s.work_end}`).join(', '):(shift.work_start?`${shift.work_start}-${shift.work_end}`:'--');
  document.getElementById('shiftState').textContent=shifts.length?'Có ca':'--';
  updatePolicyStatus();
  updateReady();
}

async function startCamera(){
  const empty=document.getElementById('cameraEmpty');
  const title=document.getElementById('cameraEmptyTitle');
  const note=document.getElementById('cameraEmptyNote');
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    cameraReady=false;
    title.textContent='Cần HTTPS';
    note.textContent='Camera/GPS trên điện thoại bị trình duyệt chặn khi mở bằng HTTP LAN. Hãy dùng HTTPS domain, ngrok hoặc Cloudflare Tunnel.';
    setPill('cameraPill','bad','Cần HTTPS');
    document.getElementById('vCamera').textContent='HTTPS';
    setDot('sCamera','bad');
    updateReady();
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    title.textContent='Không có camera web';
    note.textContent='Trình duyệt này không hỗ trợ camera web. Hãy mở bằng Chrome/Safari chính thức, không dùng trình duyệt trong Zalo/Facebook.';
    setPill('cameraPill','bad','Camera lỗi');
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:'user',width:{ideal:720},height:{ideal:960}}
    });
    video.srcObject=stream;
    await video.play();
    cameraReady=true;
    empty.classList.add('hidden');
    setPill('cameraPill','good','Camera sẵn sàng');
    document.getElementById('vCamera').textContent='OK';
    setDot('sCamera','good');
  }catch(err){
    cameraReady=false;
    title.textContent='Camera bị chặn';
    note.textContent='Không thể mở camera trước.';
    setPill('cameraPill','bad','Camera lỗi');
    document.getElementById('vCamera').textContent='Lỗi';
    setDot('sCamera','bad');
  }
  updateReady();
}

function startGps(){
  clearTimeout(gpsPendingTimer);
  clearInterval(gpsTickTimer);
  gpsStartedAt=Date.now();
  document.getElementById('vGpsDebug').textContent=window.isSecureContext?'secure':'not secure';
  setDot('sGpsDebug',window.isSecureContext?'good':'bad');
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    gpsReady=false;
    currentPosition=null;
    setPill('gpsPill','bad','Cần HTTPS');
    document.getElementById('vGps').textContent='HTTPS';
    document.getElementById('vGpsDebug').textContent='not secure';
    document.getElementById('distanceText').textContent='--';
    setDot('sGps','bad');
    toast('GPS bị chặn vì trang chưa được xem là secure context. Kiểm tra lại Chrome flag/origin.', 'bad');
    updateReady();
    return;
  }
  if(!navigator.geolocation){
    gpsReady=false;
    setPill('gpsPill','bad','Không có GPS');
    document.getElementById('vGps').textContent='Không hỗ trợ';
    document.getElementById('vGpsDebug').textContent='no geolocation';
    setDot('sGps','bad');
    updateReady();
    return;
  }
  if(geoWatchId!==null) navigator.geolocation.clearWatch(geoWatchId);
  setPill('gpsPill','warn','Đang lấy GPS');
  document.getElementById('vGps').textContent='Đang lấy';
  document.getElementById('vGpsDebug').textContent='0s';
  setDot('sGps','warn');
  setDot('sGpsDebug','warn');

  gpsTickTimer=setInterval(()=>{
    if(gpsReady){
      clearInterval(gpsTickTimer);
      return;
    }
    const seconds=Math.floor((Date.now()-gpsStartedAt)/1000);
    document.getElementById('vGpsDebug').textContent=`${seconds}s`;
    if(seconds>=15){
      setPill('gpsPill','bad','GPS quá lâu');
      document.getElementById('vGps').textContent='Timeout';
      setDot('sGps','bad');
    }
  },1000);

  const onGpsSuccess=(pos)=>{
    currentPosition={
      latitude:pos.coords.latitude,
      longitude:pos.coords.longitude,
      accuracy_m:pos.coords.accuracy
    };
    gpsReady=true;
    clearTimeout(gpsPendingTimer);
    clearInterval(gpsTickTimer);
    document.getElementById('vGpsDebug').textContent='OK';
    setDot('sGpsDebug','good');
    renderLocation();
    updateReady();
  };
  const onGpsError=(err)=>{
    gpsReady=false;
    clearTimeout(gpsPendingTimer);
    clearInterval(gpsTickTimer);
    currentPosition=null;
    const msg=gpsErrorMessage(err);
    setPill('gpsPill','bad',msg.short);
    document.getElementById('vGps').textContent=msg.value;
    document.getElementById('vGpsDebug').textContent=msg.debug;
    document.getElementById('distanceText').textContent='--';
    setDot('sGps','bad');
    setDot('sGpsDebug','bad');
    toast(msg.detail,'bad');
    updateReady();
  };
  gpsPendingTimer=setTimeout(()=>{
    if(gpsReady)return;
    onGpsError({code:3});
  },16000);

  const quickOpts={enableHighAccuracy:false,maximumAge:300000,timeout:8000};
  const preciseOpts={enableHighAccuracy:true,maximumAge:0,timeout:15000};
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then((status)=>{
      document.getElementById('vGpsDebug').textContent=`perm:${status.state}`;
      status.onchange=()=>{document.getElementById('vGpsDebug').textContent=`perm:${status.state}`;};
    }).catch(()=>{});
  }
  navigator.geolocation.getCurrentPosition(onGpsSuccess,()=>{
    navigator.geolocation.getCurrentPosition(onGpsSuccess,onGpsError,preciseOpts);
  },quickOpts);
  geoWatchId=navigator.geolocation.watchPosition(onGpsSuccess,onGpsError,preciseOpts);
}

function gpsErrorMessage(err){
  const code=err&&err.code;
  if(code===1){
    return {
      short:'GPS bị chặn',
      value:'Permission',
      debug:'code 1',
      detail:'Chrome chưa được cấp quyền vị trí cho trang này. Vào Site settings > Location và chọn Allow.'
    };
  }
  if(code===2){
    return {
      short:'Không có vị trí',
      value:'Unavailable',
      debug:'code 2',
      detail:'Điện thoại chưa trả được vị trí. Bật Location/GPS của máy, bật Wi-Fi, rồi thử lại.'
    };
  }
  if(code===3){
    return {
      short:'GPS quá lâu',
      value:'Timeout',
      debug:'code 3',
      detail:'Lấy GPS quá lâu. Hãy đứng gần cửa sổ/ngoài trời vài giây, bật Location chính xác cao rồi bấm Làm mới.'
    };
  }
  return {
    short:'GPS lỗi',
    value:'Lỗi',
    debug:`code ${code||'?'}`,
    detail:'Không lấy được GPS từ trình duyệt. Kiểm tra quyền Location của Chrome và hệ điều hành.'
  };
}

function renderLocation(){
  const branch=contextData&&contextData.branch;
  const pos=currentPosition;
  if(!pos){
    document.getElementById('distanceText').textContent='--';
    return;
  }
  const accuracy=pos.accuracy_m||0;
  document.getElementById('vGps').textContent=`${Math.round(accuracy)} m`;

  if(!branch){
    setPill('gpsPill','good','Đã có GPS');
    setDot('sGps','good');
    document.getElementById('distanceText').textContent='Chưa có cửa hàng';
    return;
  }
  if(branch.latitude==null||branch.longitude==null){
    setPill('gpsPill','good','Đã có GPS');
    setDot('sGps','good');
    document.getElementById('distanceText').textContent='Chưa cấu hình tọa độ';
    return;
  }
  const d=haversine(pos.latitude,pos.longitude,branch.latitude,branch.longitude);
  const radius=branch.geofence_radius_m||50;
  document.getElementById('distanceText').textContent=`${Math.round(d)} m`;
  if(accuracy>(contextData.policy.gps_max_accuracy_m||100)){
    setPill('gpsPill','bad','GPS yếu');
    setDot('sGps','bad');
  }else if(d<=radius){
    setPill('gpsPill','good','Trong cửa hàng');
    setDot('sGps','good');
  }else{
    setPill('gpsPill','bad','Ngoài bán kính');
    setDot('sGps','bad');
  }
}

function updatePolicyStatus(){
  const branch=contextData&&contextData.branch;
  const ok=!!(contextData&&contextData.employee&&branch&&branch.mobile_attendance_enabled&&branch.latitude!=null&&branch.longitude!=null);
  document.getElementById('vPolicy').textContent=ok?'OK':'Chưa sẵn sàng';
  setDot('sPolicy',ok?'good':'bad');
}

function updateReady(){
  const branch=contextData&&contextData.branch;
  const policyOk=!!(contextData&&contextData.employee&&branch&&branch.mobile_attendance_enabled&&branch.latitude!=null&&branch.longitude!=null);
  const ready=mobileDeviceOk&&policyOk&&cameraReady&&gpsReady&&!busy;
  btnAttend.disabled=!ready;
  document.getElementById('readyState').textContent=ready?'Sẵn sàng':'Chờ';
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000;
  const p1=lat1*Math.PI/180,p2=lat2*Math.PI/180;
  const dp=(lat2-lat1)*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function captureFrame(){
  if(!video.videoWidth||!video.videoHeight)return '';
  const maxW=720;
  const scale=Math.min(1,maxW/video.videoWidth);
  canvas.width=Math.round(video.videoWidth*scale);
  canvas.height=Math.round(video.videoHeight*scale);
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',0.84);
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function submitAttendance(){
  if(busy)return;
  busy=true;
  updateReady();
  showResult('Đang xác minh','Server đang kiểm tra khuôn mặt, vị trí và ca làm.',[], 'warn');
  try{
    const count=Math.max(1,Math.min((contextData.policy&&contextData.policy.capture_frames)||3,5));
    const frames=[];
    for(let i=0;i<count;i++){
      const frame=captureFrame();
      if(frame)frames.push(frame);
      if(i<count-1)await wait(160);
    }
    const payload={
      branch_id:contextData.branch&&contextData.branch.id,
      latitude:currentPosition&&currentPosition.latitude,
      longitude:currentPosition&&currentPosition.longitude,
      accuracy_m:currentPosition&&currentPosition.accuracy_m,
      device_id:deviceId(),
      frames
    };
    const res=await authFetch('/api/mobile/attendance/attempt',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await res.json();
    const meta=[
      data.check_type?typeLabel(data.check_type):'',
      data.device_kind?data.device_kind:'',
      data.distance_m!=null?`${Math.round(data.distance_m)}m`:'',
      data.face_confidence?`${Math.round(data.face_confidence*100)}%`:'',
      data.attempt_id?`#${data.attempt_id}`:''
    ].filter(Boolean);
    if(data.ok){
      showResult(data.check_type==='check_out'?'Check out thành công':'Check in thành công',data.message||'Đã ghi nhận bằng server time.',meta,'good');
      toast('Chấm công thành công','good');
      await loadContext();
    }else{
      showResult('Không ghi nhận',data.message||'Lượt chấm công bị chặn.',meta,'bad');
      toast(data.message||'Lượt chấm công bị chặn','bad');
    }
  }catch(err){
    showResult('Có lỗi xảy ra','Không thể gửi lượt chấm công.',[], 'bad');
    toast('Không thể gửi lượt chấm công','bad');
  }finally{
    busy=false;
    updateReady();
  }
}

function typeLabel(type){
  return type==='check_out'?'Ra':'Vào';
}

function showResult(title,msg,meta,tone){
  const sheet=document.getElementById('resultSheet');
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('resultMeta').innerHTML=(meta||[]).map(x=>`<span class="mini">${x}</span>`).join('');
  sheet.style.borderColor=tone==='good'?'rgba(51,209,122,.42)':tone==='bad'?'rgba(255,95,109,.44)':'rgba(255,202,58,.42)';
  sheet.classList.add('show');
}

async function refreshAll(){
  await loadContext();
  renderLocation();
  startGps();
  toast('Đã làm mới dữ liệu và thử lấy GPS lại');
}

async function init(){
  mobileDeviceOk=detectMobileDevice();
  document.getElementById('deviceLabel').textContent=mobileDeviceOk?'Mobile attendance':'Thiết bị không hợp lệ';
  if(!mobileDeviceOk){
    toast('Chấm công mobile chỉ cho phép từ điện thoại. Máy tính dùng kiosk tại quán.', 'bad');
  }
  setInterval(updateClock,1000);
  await loadContext();
  await startCamera();
  startGps();
}

init().catch(()=>toast('Không tải được trang chấm công','bad'));
</script>
